<body>

<h1>100字帳 作文下書き</h1>

<div class="layout">

  <section class="panel input-panel">

    <label for="essay">作文を入力</label>

    <textarea
      id="essay"
      placeholder="ここに作文を入力してください。&#10;&#10;一番右の列の上から下へ表示されます。"
    ></textarea>

    <div class="counter">
      文字数：<strong id="charCount">0</strong>文字
    </div>

    <div class="controls">
      <button id="clearBtn" class="secondary">クリア</button>
      <button id="printBtn">印刷</button>
    </div>

    <div class="hint">
      ・一番右の列の上から下へ書き進みます。<br>
      ・101文字目以降は次のページに表示されます。
    </div>

  </section>

  <section class="panel preview-panel">

    <div class="preview-title">
      <h2>100字帳プレビュー</h2>
      <span class="page-count" id="pageCount">1ページ</span>
    </div>

    <div id="pages"></div>

  </section>

</div>

<script>

  const essay = document.getElementById("essay");
  const pages = document.getElementById("pages");
  const charCount = document.getElementById("charCount");
  const pageCount = document.getElementById("pageCount");

  function normalizeText(text) {
    return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  }

  const SMALL_CHARS = new Set([
    "っ", "ゃ", "ゅ", "ょ",
    "ぁ", "ぃ", "ぅ", "ぇ", "ぉ",
    "ッ", "ャ", "ュ", "ョ",
    "ァ", "ィ", "ゥ", "ェ", "ォ"
  ]);

  const PUNCTUATION = new Set([
    "。", "、"
  ]);

  function createTextSpan(text, className = "") {
    const span = document.createElement("span");
    span.textContent = text;

    if (className) {
      span.className = className;
    }

    return span;
  }

  function makeCell(slot) {

    const cell = document.createElement("div");
    cell.className = "cell";

    if (!slot) return cell;

    const ch = slot.main || "";

    if (ch) {

      let className = "";

      /*
       * 小さい文字と句読点を分離。
       */
      if (PUNCTUATION.has(ch)) {
        className = "punctuation-char";
      } else if (SMALL_CHARS.has(ch)) {
        className = "small-char";
      }

      const span = createTextSpan(ch, className);

      cell.appendChild(span);
      cell.classList.add("full");
    }

    /*
     * 列頭に来た句読点は前のマスの右下へ。
     */
    if (slot.punctuation) {

      cell.appendChild(
        createTextSpan(
          slot.punctuation,
          "punctuation-overlay"
        )
      );

      cell.classList.add("full");
    }

    return cell;
  }

  /*
   * 入力文字を100マス帳の通し番号に配置する。
   *
   * ・各列は上から下へ10マス
   * ・列が埋まると右から左へ移動
   * ・段落改行は次の列の先頭へ移動し、1マス空ける
   * ・列頭の「。」「、」は直前列の最後のマス右下へ配置する
   */
  function buildSlots(chars) {

    const slots = [];

    let cursor = 0;
    let paragraphStart = true;

    function ensureSlot(index) {

      while (slots.length <= index) {
        slots.push(null);
      }

      if (!slots[index]) {
        slots[index] = {};
      }

      return slots[index];
    }

    for (const ch of chars) {

      if (ch === "\n") {

        /*
         * 改行後は次の縦列の先頭へ。
         */
        cursor = Math.ceil(cursor / 10) * 10;

        paragraphStart = true;

        continue;
      }

      if (paragraphStart) {

        cursor += 1;
        paragraphStart = false;
      }

      /*
       * 列頭に来た句読点は、
       * 直前列の最後のマス右下へ。
       */
      if (
        PUNCTUATION.has(ch) &&
        cursor > 0 &&
        cursor % 10 === 0
      ) {

        const previous =
          ensureSlot(cursor - 1);

        previous.punctuation = ch;

        continue;
      }

      ensureSlot(cursor).main = ch;

      cursor += 1;
    }

    return {
      slots,
      usedLength: Math.max(cursor, 1)
    };
  }

  function render() {

    const chars = [
      ...normalizeText(essay.value)
    ];

    /*
     * 改行は文字数に含めない。
     */
    charCount.textContent =
      chars.filter(ch => ch !== "\n").length;

    const layout = buildSlots(chars);

    const totalPages =
      Math.max(
        1,
        Math.ceil(layout.usedLength / 100)
      );

    pageCount.textContent =
      totalPages + "ページ";

    pages.innerHTML = "";

    for (
      let page = 0;
      page < totalPages;
      page++
    ) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "page-wrapper";

      const label =
        document.createElement("div");

      label.className =
        "page-label";

      label.textContent =
        (page + 1) + "ページ目";

      wrapper.appendChild(label);

      const frame =
        document.createElement("div");

      frame.className =
        "notebook-frame";

      const grid =
        document.createElement("div");

      grid.className =
        "writing-grid";

      /*
       * col=0が一番右の列。
       * row=0から上→下へ配置。
       */
      for (
        let col = 0;
        col < 10;
        col++
      ) {

        const group =
          document.createElement("div");

        group.className =
          "column-group";

        const main =
          document.createElement("div");

        main.className =
          "main-column";

        const furigana =
          document.createElement("div");

        furigana.className =
          "furigana-column";

        for (
          let row = 0;
          row < 10;
          row++
        ) {

          const index =
            page * 100 +
            col * 10 +
            row;

          main.appendChild(
            makeCell(
              layout.slots[index] || null
            )
          );

          furigana.appendChild(
            makeCell(null)
          );
        }

        /*
         * 本文の右側にふりがな欄。
         */
        group.appendChild(main);
        group.appendChild(furigana);

        grid.appendChild(group);
      }

      /*
       * 日付欄。
       */
      const datePanel =
        document.createElement("div");

      datePanel.className =
        "date-panel";

      datePanel.innerHTML = `
        <div class="date-item">月</div>
        <div class="date-item">日</div>
        <div class="date-item">曜日</div>
        <div class="date-bottom">（　）</div>
      `;

      frame.appendChild(grid);
      frame.appendChild(datePanel);

      wrapper.appendChild(frame);

      pages.appendChild(wrapper);
    }
  }

  essay.addEventListener(
    "input",
    render
  );

  document
    .getElementById("clearBtn")
    .addEventListener("click", () => {

      if (
        confirm(
          "入力した作文をクリアしますか？"
        )
      ) {

        essay.value = "";

        render();

        essay.focus();
      }
    });

  document
    .getElementById("printBtn")
    .addEventListener("click", () => {

      window.print();

    });

  render();

</script>

</body>
</html>
